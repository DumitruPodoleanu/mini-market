services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: minimarket
      POSTGRES_DB: minimarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimarket -d minimarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Catalog: "Host=db;Port=5432;Database=minimarket;Username=minimarket;Password=minimarket"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
